name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Capture Ruff fix diff
        run: |
          cp tests/test_compatibility_interpretation.py /tmp/test-before.py
          python -m ruff check . --fix || true
          diff -u /tmp/test-before.py tests/test_compatibility_interpretation.py > ruff-fix.diff || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruff-fix-diff
          path: ruff-fix.diff
      - run: python -m ruff check .
      - run: python -m pytest
